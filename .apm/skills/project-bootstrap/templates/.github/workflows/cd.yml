name: CD

on:
  push:
    branches:
      - main
    tags:
      - '<scope>/server@*'
  workflow_dispatch:
    inputs:
      environment:
        description: Deploy target
        type: choice
        options:
          - staging
          - production
        default: staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Keep registry credentials out of the macOS keychain on self-hosted runners.
  DOCKER_CONFIG: ${{ github.workspace }}/.docker
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

permissions:
  contents: read

jobs:
  release:
    name: Version or tag
    if: github.ref == 'refs/heads/main'
    runs-on: <runner>
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: changesets/action@v2
        with:
          cwd: apps/server
          version-script: nub exec changeset version
          publish-script: nub exec changeset tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  changes:
    name: Detect server changes
    runs-on: <runner>
    outputs:
      server: ${{ steps.affected.outputs.server }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Detect affected packages
        id: affected
        shell: bash
        run: |
          AFFECTED=$(nub exec turbo run build --affected --dry=json | jq -r '.packages[]')
          echo "Affected packages: $AFFECTED"

          SERVER=false
          for package in $AFFECTED; do
            if [[ "$package" == "<scope>/server" ]]; then
              SERVER=true
            fi
          done

          echo "server=$SERVER" >> "$GITHUB_OUTPUT"
          echo "Server affected: $SERVER"

  publish-image:
    name: Publish Docker image
    needs:
      - changes
    if: |
      always() && (
        (needs.changes.result == 'success' && needs.changes.outputs.server == 'true') ||
        startsWith(github.ref, 'refs/tags/<scope>/server@') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: <runner>
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Use inline docker credentials (headless runner)
        run: |
          # Initialize the DOCKER_CONFIG directory itself: if its config.json
          # is absent, the docker CLI falls back to ~/.docker/config.json,
          # whose credsStore (osxkeychain) prompts — and fails headless when
          # the runner's session is locked.
          mkdir -p "$DOCKER_CONFIG"
          printf '{"auths":{}}' > "$DOCKER_CONFIG/config.json"
          mkdir -p ~/.docker
          printf '{}' > ~/.docker/config.json

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=nightly,enable=${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging') }}
            type=sha,prefix=sha-
            type=match,pattern=<scope>/server@(.*),group=1,enable=${{ startsWith(github.ref, 'refs/tags/<scope>/server@') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/<scope>/server@') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production') }}

      - uses: docker/setup-buildx-action@v4

      # Build into the local daemon, smoke test that exact image, and only then
      # push it. Pushing first would publish a crashing image as `nightly`,
      # which the staging environment pulls on its next rollout.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test built image
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: bash .github/scripts/smoke-image.sh "$IMAGE"

      - name: Push smoke-tested image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker push "$tag"
          done <<< "$TAGS"

  deploy-staging:
    name: Deploy staging
    needs:
      - publish-image
    if: |
      needs.publish-image.result == 'success' && (
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
      )
    runs-on: <runner>
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - name: Deploy and verify
        env:
          DEPLOY_ENVIRONMENT: staging
          APP_URL: ${{ vars.APP_URL }}
        run: bash .github/scripts/deploy.sh

  deploy-production:
    name: Deploy production
    needs:
      - publish-image
    if: |
      needs.publish-image.result == 'success' && (
        startsWith(github.ref, 'refs/tags/<scope>/server@') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
      )
    runs-on: <runner>
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Deploy and verify
        env:
          DEPLOY_ENVIRONMENT: production
          APP_URL: ${{ vars.APP_URL }}
        run: bash .github/scripts/deploy.sh

  cleanup:
    name: Prune old images
    needs:
      - publish-image
    if: always() && needs.publish-image.result == 'success'
    runs-on: <runner>
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: <project>
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: true
