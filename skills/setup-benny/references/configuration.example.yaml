schema_version: 1

automations:
  triage_name: "benny-triage"
  reproduce_name: "benny-reproduce"

conversation:
  source_channel_id: "SOURCE_CHANNEL_ID"
  operations_channel_id: ""
  triage_identity_user_id: "TRIAGE_IDENTITY_USER_ID"
  read_action: "configured-thread-read-action"
  thread_reply_action: "configured-thread-reply-action"
  file_download_action: "configured-file-download-action"
  operations_post_action: "configured-operations-post-action"
  operations_edit_action: "configured-operations-edit-action"
  optional_credential_env: "BENNY_CONVERSATION_TOKEN"
  allow_source_root_posts: false
  allow_worker_external_messages: false

repository:
  url: "https://github.com/example-org/example-repo"
  default_branch: "main"
  draft_pull_request_action: "configured-draft-pull-request-action"
  pull_request_url_format: "https://github.com/{owner}/{repo}/pull/{number}"
  draft_only: true

tracker:
  type: "configured-tracker-type"
  adapter_skill_name: "issue-tracker-adapter-placeholder"
  team: "team-placeholder"
  project: "project-placeholder"
  labels:
    bug: "bug-label-placeholder"
    performance: "performance-label-placeholder"
    intake: "intake-label-placeholder"
    needs_repro: "needs-repro-label-placeholder"
  status: "intake-status-placeholder"
  source_link_title: "Source report"
  require_compensation_action: true

routing:
  map_path: ".agents/benny/routing.md"
  owner_pings_default: false
  allow_feature_owner_ping: false
  allow_confirmed_regression_author_ping: false

control:
  skill_name: "control-target-app"
  feature_map_path: ".agents/benny/feature-map.md"
  environment: "safe-test-environment-placeholder"
  artifact_directory: "ARTIFACT_DIRECTORY_OUTSIDE_REPOSITORY"
  artifact_retention_hours: 24

verdict_markers:
  bug: "[benny:bug]"
  performance: "[benny:performance]"
  other: "[benny:other]"
  tracker_attribute: "tracker"

status:
  seen: "Seen"
  reproducing: "Reproducing"
  reproduced: "Reproduced"
  could_not_reproduce: "Could not reproduce"
  blocked: "Blocked"
  fixing: "Attempting bounded fix"
  fix_failed: "Fix did not land"
  pull_request_opened: "Draft pull request opened"
  verifying_existing_fix: "Verifying existing fix"
  existing_fix_verified: "Existing fix verified"
  existing_fix_insufficient: "Existing fix reproduced but did not resolve the issue"

budgets:
  poll_seconds: 45
  verdict_wait_minutes: 45
  triage_follow_up_minutes: 10
  triage_total_minutes: 30
  repro_minutes: 60
  rejection_window_minutes: 10
  fix_minutes: 90
  operations_follow_up_minutes: 45

models:
  triage:
    role: "synthesis"
    size: "M"
  reproduce:
    role: "complex-implementation"
    size: "L"
  code:
    role: "implementation"
    size: "M"
  media_review:
    role: "review"
    size: "M"

authorization:
  approved: false
  approved_by: ""
  approved_on: ""
  approved_scope_digest: ""
  approved_scope:
    source_channel_id: ""
    operations_channel_id: ""
    repository_url: ""
    repository_default_branch: ""
    tracker_type: ""
    tracker_team: ""
    tracker_project: ""
    bug_marker: ""
    performance_marker: ""
    other_marker: ""
    draft_only: true
  allow_triage_thread_reply: false
  allow_triage_follow_up_reply: false
  triage_follow_up_reply_limit: 1
  allow_tracker_duplicate_update: false
  allow_tracker_issue_create: false
  allow_operations_status: false
  allow_operations_follow_up_reply: false
  operations_follow_up_reply_limit: 1
  allow_confirmed_repro_thread_reply: false
  allow_existing_fix_thread_reply: false
  existing_fix_thread_reply_limit: 1
  allow_draft_pull_request: false
  allow_test_messages: false
