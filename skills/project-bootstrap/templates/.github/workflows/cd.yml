name: CD

on:
  push:
    branches:
      - main
    tags:
      - '<scope>/server@*'
  workflow_dispatch:
    inputs:
      environment:
        description: Deploy target
        type: choice
        options:
          - staging
          - production
        default: staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Keep registry credentials out of the macOS keychain on self-hosted runners.
  DOCKER_CONFIG: ${{ github.workspace }}/.docker
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect server changes
    runs-on: <runner>
    outputs:
      server: ${{ steps.affected.outputs.server }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The image build copies the whole repository (`COPY . .`), so a change
      # counts unless every changed path is one that never reaches the image or
      # the deploy. A wrong "yes" costs one redundant staging deploy; a wrong
      # "no" leaves staging behind main.
      - name: Detect server changes
        id: affected
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          SERVER=false
          # A push without a usable previous commit (new branch, force push)
          # cannot be compared, so it deploys.
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
            SERVER=true
          else
            changed=$(git diff --name-only "$BEFORE" HEAD -- . \
              ':(exclude,glob)**/*.md' ':(exclude)docs' ':(exclude).agents' \
              ':(exclude).github/workflows' ':(exclude).github/actions' \
              ':(exclude).github/dependabot.yml' ':(exclude).github/scripts/next-release-tag.sh' \
              ':(exclude)apps/e2e' ':(exclude)packages/cli' ':(exclude)packages/oxlint-plugin' \
              ':(exclude)scripts' ':(exclude)hk.pkl' ':(exclude).actionlint.yaml' \
              ':(exclude)oxfmt.config.ts' ':(exclude)oxlint.config.ts' ':(exclude)vitest.config.ts' \
              ':(exclude)communique.toml' ':(exclude)fnox.toml' ':(exclude).env.example' ':(exclude).gitignore')
            if [[ -n "$changed" ]]; then
              printf 'Changed paths that reach the image or deploy:\n%s\n' "$changed"
              SERVER=true
            fi
          fi

          echo "server=$SERVER" >> "$GITHUB_OUTPUT"
          echo "Server affected: $SERVER"

  publish-image:
    name: Publish Docker image
    needs:
      - changes
    if: |
      always() && (
        (needs.changes.result == 'success' && needs.changes.outputs.server == 'true') ||
        startsWith(github.ref, 'refs/tags/<scope>/server@') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: <runner>
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Use inline docker credentials (headless runner)
        run: |
          # Initialize the DOCKER_CONFIG directory itself: if its config.json
          # is absent, the docker CLI falls back to ~/.docker/config.json,
          # whose credsStore (osxkeychain) prompts — and fails headless when
          # the runner's session is locked.
          mkdir -p "$DOCKER_CONFIG"
          printf '{"auths":{}}' > "$DOCKER_CONFIG/config.json"
          mkdir -p ~/.docker
          printf '{}' > ~/.docker/config.json

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=nightly,enable=${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging') }}
            type=sha,prefix=sha-,format=long
            type=match,pattern=<scope>/server@(.*),group=1,enable=${{ startsWith(github.ref, 'refs/tags/<scope>/server@') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/<scope>/server@') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production') }}

      - uses: docker/setup-buildx-action@v4

      # Build into the local daemon, smoke test that exact image, and only then
      # push it. Pushing first would publish a crashing image as `nightly`,
      # which the staging environment pulls on its next rollout.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test built image
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: bash .github/scripts/smoke-image.sh "$IMAGE"

      - name: Push smoke-tested image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker push "$tag"
          done <<< "$TAGS"

  deploy-staging:
    name: Deploy staging
    needs:
      - publish-image
    if: |
      needs.publish-image.result == 'success' && (
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
      )
    runs-on: <runner>
    environment:
      name: staging
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - name: Load the Coolify deploy token from 1Password
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          COOLIFY_TOKEN: op://project-<project>/coolify-deploy-staging/credential

      - name: Deploy and verify
        env:
          DEPLOY_ENVIRONMENT: staging
          APP_URL: ${{ vars.APP_URL }}
          IMAGE_TAG: sha-${{ github.sha }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
        run: bash .github/scripts/deploy.sh

  deploy-production:
    name: Deploy production
    needs:
      - publish-image
    if: |
      needs.publish-image.result == 'success' && (
        startsWith(github.ref, 'refs/tags/<scope>/server@') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
      )
    runs-on: <runner>
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - name: Load the Coolify deploy token from 1Password
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          COOLIFY_TOKEN: op://project-<project>/coolify-deploy-production/credential

      - name: Deploy and verify
        env:
          DEPLOY_ENVIRONMENT: production
          APP_URL: ${{ vars.APP_URL }}
          IMAGE_TAG: sha-${{ github.sha }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
        run: bash .github/scripts/deploy.sh

  # Rewrites the release's notes with communiqué, which reads the commits and
  # pull requests since the previous release tag (see communique.toml). The
  # model runs through GitHub Copilot with a fine-grained token that has the
  # Copilot Requests permission; Actions' own token cannot call Copilot for a
  # repository owned by a personal account. Runs in the production
  # environment only to read the 1Password service account token.
  release-notes:
    name: Write release notes
    if: startsWith(github.ref, 'refs/tags/<scope>/server@')
    runs-on: <runner>
    timeout-minutes: 20
    environment:
      name: production
      deployment: false
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Load the Copilot token from 1Password
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OPENAI_API_KEY: op://Agent Automation/github-copilot-requests/credential

      - uses: jdx/mise-action@v4.3.0
        with:
          install: false

      - name: Generate and publish the notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_BASE_URL: https://api.githubcopilot.com
          OPENAI_CUSTOM_HEADERS: '{"copilot-integration-id":"copilot-developer-cli"}'
          TAG: ${{ github.ref_name }}
        run: |
          mise x communique@1.8.0 -- communique generate "$TAG" \
            --package server --github-release --provider openai

  cleanup:
    name: Prune old images
    needs:
      - publish-image
    if: always() && needs.publish-image.result == 'success'
    runs-on: <runner>
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: <project>
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: true
