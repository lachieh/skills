name: Validate and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Validate portable source and runtime projections
        run: python3 scripts/verify-package.py
      - name: Check generated files
        run: uv run scripts/build-release.py --check
      - name: Build combined native release with APM
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_REF_TYPE" == tag ]]; then
            git merge-base --is-ancestor HEAD origin/main
            uv run scripts/build-release.py --tag "$RELEASE_REF_NAME"
          else
            uv run scripts/build-release.py
          fi
      - name: Verify Codex installation and update
        run: python3 scripts/verify-codex-release.py build/release
      - name: Verify native Claude and OpenCode discovery
        run: python3 scripts/verify-native-release.py build/release
      - name: Verify Pi package discovery
        run: node scripts/verify-pi-release.mjs build/release
      - name: Archive the combined native package
        run: python3 -c "import shutil; shutil.make_archive('build/lachie-skills', 'zip', 'build/release')"
      - name: Check source remains unchanged
        run: git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-releases
          path: build/lachie-skills.zip
          include-hidden-files: true
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: native-releases
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-releases
          path: build/
      - name: Publish the downloadable release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
          gh release upload "$RELEASE_TAG" build/lachie-skills.zip --clobber
