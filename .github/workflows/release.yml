name: Validate and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changeset:
    # The version PR consumes changesets instead of adding one.
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Require a changeset
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if ! changeset status --since="origin/$BASE_REF"; then
            echo "::error::Add a changeset with 'mise exec -- changeset', or 'mise exec -- changeset --empty' for a change that needs no release."
            exit 1
          fi

  validate:
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Validate portable source and runtime projections
        run: python3 scripts/verify-package.py
      - name: Check generated files
        run: uv run scripts/build-release.py --check
      - name: Find an untagged version on main
        id: release
        if: github.event_name == 'push'
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          if ! git rev-parse --quiet --verify "refs/tags/$tag" >/dev/null; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi
      - name: Build combined native release with APM
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: uv run scripts/build-release.py ${RELEASE_TAG:+--tag "$RELEASE_TAG"}
      - name: Verify Codex installation and update
        run: python3 scripts/verify-codex-release.py build/release
      - name: Verify native Claude and OpenCode discovery
        run: python3 scripts/verify-native-release.py build/release
      - name: Verify Pi package discovery
        run: node scripts/verify-pi-release.mjs build/release
      - name: Archive the combined native package
        run: python3 -c "import shutil; shutil.make_archive('build/lachie-skills', 'zip', 'build/release')"
      - name: Check source remains unchanged
        run: git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-releases
          path: build/lachie-skills.zip
          include-hidden-files: true
          if-no-files-found: error

  publish:
    # Merging the version PR leaves main on a version without a tag.
    if: needs.validate.outputs.release-tag != ''
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: native-releases
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-releases
          path: build/
      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.release-tag }}
        run: |
          awk -v heading="## ${RELEASE_TAG#v}" '$0 == heading { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > build/notes.md
          gh release create "$RELEASE_TAG" build/lachie-skills.zip --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file build/notes.md

  version:
    # Opens or updates the version PR while changesets are pending on main.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: version-pr
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: mise run version
          commit-message: Version packages
          pr-title: Version packages
